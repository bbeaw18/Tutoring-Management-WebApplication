<div class="dashboard-layout">
  <app-sidebar
    [isOpen]="sidebarOpen"
    [isCollapsed]="sidebarCollapsed"
    (close)="closeSidebar()"
    (toggleCollapsed)="toggleSidebarCollapse($event)">
  </app-sidebar>

  <div class="dashboard-content" [class.sidebar-collapsed]="sidebarCollapsed">
    <app-header
      [sidebarOpen]="sidebarOpen"
      [sidebarCollapsed]="sidebarCollapsed"
      (toggleSidebar)="toggleSidebar()">
    </app-header>

    <!-- Registration pending banner for unregistered teachers -->
    <div class="registration-banner"
         *ngIf="currentUser?.role === 'teacher' && currentUser?.registrationStatus === 'unregistered'">
      <div class="banner-content">
        <span class="banner-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <div class="banner-text">
          <strong>ลงทะเบียนยังไม่สำเร็จ</strong>
          <span>บัญชีของคุณรอการอนุมัติจาก Manager หรือ Admin กรุณารอการยืนยัน</span>
        </div>
      </div>
    </div>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Popup ข้อตกลงการใช้บริการ (blocking) -->
  <app-terms-agreement
    *ngIf="termsDoc"
    [doc]="termsDoc"
    [submitting]="submittingTerms"
    (accepted)="onAcceptTerms()"
    (declined)="onDeclineTerms()">
  </app-terms-agreement>
</div>
