<div class="auth-simple">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-glyph" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <polygon points="24,10 42,20 24,30 6,20" fill="currentColor" opacity="0.95"/>
          <path d="M15,24 L15,35 C15,35 19,41 24,41 C29,41 33,35 33,35 L33,24 L24,30 Z" fill="currentColor" opacity="0.78"/>
        </svg>
      </div>
      <div class="brand-text">
        Know More Sci
        <small>Knowledge Management System</small>
      </div>
    </div>

    <p class="eyebrow">Forgot password</p>
    <h1 class="title">ลืมรหัสผ่าน?</h1>
    <p class="sub">กรอกอีเมลที่ใช้สมัครสมาชิก เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้ภายในไม่กี่นาที</p>

    <div *ngIf="successMessage" class="alert alert-success" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span>{{ successMessage }}</span>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error" role="alert" aria-live="assertive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form *ngIf="!successMessage" [formGroup]="form" (ngSubmit)="submit()" class="form-stack" novalidate>
      <div class="field">
        <label for="email">อีเมล</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="name@example.com"
          autocomplete="email"
          [class.is-error]="submitted && f['email'].invalid"
        />
        <div *ngIf="submitted && f['email'].invalid" class="field-error">
          <span *ngIf="f['email'].hasError('required')">กรุณากรอกอีเมล</span>
          <span *ngIf="f['email'].hasError('email')">รูปแบบอีเมลไม่ถูกต้อง</span>
        </div>
      </div>

      <button type="submit" class="cta" [disabled]="loading">
        <span *ngIf="!loading">ส่งลิงก์ตั้งรหัสผ่านใหม่</span>
        <span *ngIf="loading">กำลังส่ง…</span>
      </button>
    </form>

    <p class="link-row">
      จำรหัสผ่านได้แล้ว? <a routerLink="/login">เข้าสู่ระบบ</a>
    </p>
  </div>
</div>
